{% extends 'base.html' %}
{% load static %}
{% block title %}दरभाउपत्र सम्झौता तयारी{% endblock %}
{% block content %}
<div class="max-w-5xl mx-auto space-y-4">

  <div>
    <h1 class="text-lg md:text-xl font-bold text-slate-800">दरभाउपत्र (Quatation) सम्झौताकाको तयारी</h1>
    <p class="text-sm text-slate-500 mt-0.5">दरभाउपत्र सम्झौता विवरण भर्नुहोस्</p>
  </div>

  <div class="card">
    <form action="add_quatation_agreement" method="post">
      {% csrf_token %}
      <div class="p-6 space-y-6">

        <div>
          <h2 class="section-title"><i class="fas fa-building"></i> योजना विवरण</h2>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="form-label">योजनाको नामः</label>
              <input type="text" class="form-input" name="project_name" value="{{ project_name }}" required>
            </div>
            <div>
              <label class="form-label">सवै भन्दा कम कबोल गर्ने फर्मको नामः</label>
              <input hidden type="text" class="form-input" name="quatation_id" value="{{ quatation_id }}" required>
              <input type="text" class="form-input" name="project_name" value="{{ lowest_firm_name }},{{ lowest_firm_address }}" required>
            </div>
          </div>
        </div>

        <div>
          <h2 class="section-title"><i class="fas fa-calendar-check"></i> सम्झौता मितिहरु</h2>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="form-label">सम्झौता मिति</label>
              <input type="text" class="form-input nepali-date date-required-check" name="agreement_date" placeholder="सम्झौता मिति" required>
            </div>
            <div>
              <label class="form-label">काम सम्पन्न गर्नु पर्ने मिति</label>
              <input type="text" class="form-input nepali-date date-required-check" name="expire_date" placeholder="काम सम्पन्न गर्नु पर्ने मिति" required>
            </div>
          </div>
        </div>

      </div>
      <div class="px-6 py-4 bg-slate-50 border-t border-slate-100 rounded-b-2xl flex justify-end">
        <button type="submit" onclick="validateForm()" class="btn-success">
          <i class="fas fa-print"></i> Save &amp; Print
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% block script %}
<script>
  function validateForm() {
    var form = document.querySelector("form");
    if (!form.checkValidity()) {
      event.preventDefault();
      event.stopPropagation();
      form.classList.add("was-validated");
    }
    form.classList.add("was-validated");
  }
</script>
{% endblock %}
