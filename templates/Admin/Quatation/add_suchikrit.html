{% extends 'base.html' %}
{% load static %}
{% block title %}सूचिकरण{% endblock %}
{% block content %}
<div class="max-w-5xl mx-auto space-y-4">

  <div>
    <h1 class="text-lg md:text-xl font-bold text-slate-800">फर्म तथा निर्माण व्यवसायीहरुको विवरण सूचिकृत गर्नुहोस्</h1>
  </div>

  <div class="card">
    <form action="add_suchikrit_list" method="post">
      {% csrf_token %}
      <div class="p-6 space-y-6">

        <div>
          <h2 class="section-title"><i class="fas fa-building"></i> फर्म विवरण</h2>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="form-label">फर्मको नामः</label>
              <input type="text" class="form-input" name="firm_name" placeholder="फर्मको नामः">
            </div>
            <div>
              <label class="form-label">फर्मको ठेगाना</label>
              <input type="text" class="form-input" name="firm_address" placeholder="फर्मको ठेगाना">
            </div>
            <div>
              <label class="form-label">फर्मको प्रोपाइटरको नामः</label>
              <input type="text" class="form-input" name="firm_owner" placeholder="फर्मको प्रोपाइटरको नामः">
            </div>
            <div>
              <label class="form-label">फर्मको पान नम्बर</label>
              <input type="text" class="form-input" name="firm_pan" required>
            </div>
            <div>
              <label class="form-label">फर्मको सम्पर्क नम्बर</label>
              <input type="text" class="form-input" name="firm_contact" required>
            </div>
            <div>
              <label class="form-label">सुचिकृत मिति</label>
              <input type="text" class="form-input nepali-date date-required-check" name="suchikrit_date" placeholder="सुचिकृत मिति" required>
            </div>
          </div>
        </div>

      </div>
      <div class="px-6 py-4 bg-slate-50 border-t border-slate-100 rounded-b-2xl flex justify-end">
        <button type="submit" onclick="validateForm()" class="btn-success">
          <i class="fas fa-print"></i> Save &amp; Print
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% block script %}
<script>
  function validateForm() {
    var form = document.querySelector("form");
    if (!form.checkValidity()) {
      event.preventDefault();
      event.stopPropagation();
      form.classList.add("was-validated");
    }
    form.classList.add("was-validated");
  }
</script>
{% endblock %}
