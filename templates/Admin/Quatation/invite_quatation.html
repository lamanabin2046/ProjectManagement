{% extends 'base.html' %}
{% load static %}
{% block title %}प्रस्ताव माग{% endblock %}
{% block content %}
<div class="max-w-5xl mx-auto space-y-4">

  <div>
    <h1 class="text-lg md:text-xl font-bold text-slate-800">योजना/आयोजनाको लागत अनुमान थप्नुहोस्</h1>
  </div>

  <div class="card">
    <form action="{% url 'invite_quatation' %}" method="post" id="add_project_form">
      {% csrf_token %}
      <div class="p-6 space-y-6">

        <div>
          <h2 class="section-title"><i class="fas fa-building"></i> योजना</h2>
          <div>
            <label class="form-label">योजनाको नामः</label>
            <select class="form-select select2 w-full" name="project" required onchange="updateBudget(this)">
              <option value="{{ i.id }}" data-budget="{{ i.budget }}">योजना छान्नुहोस</option>
              {% for i in projects %}
              <option value="{{ i.id }}" data-budget="{{ i.budget }}">{{ i.name }}</option>
              {% endfor %}
            </select>
          </div>
        </div>

        <div>
          <h2 class="section-title"><i class="fas fa-calculator"></i> लागत अनुमान</h2>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
              <label class="form-label">विनियोजत रकम</label>
              <input type="text" class="form-input" name="budget" id="budget" placeholder="Allocated Budget" required>
            </div>
            <div>
              <label class="form-label">कन्टेन्जेन्सी कट्टी रकम: {{ rate }}%</label>
              <input type="text" class="form-input" name="contingency" id="contingency" value="contingency" required>
            </div>
            <div>
              <label class="form-label">कुल लागत अनुमान</label>
              <input type="text" class="form-input" name="cost_estimate" id="cost_estimate" placeholder="Total Cost Amount" required>
            </div>
          </div>
        </div>

        <div>
          <h2 class="section-title"><i class="fas fa-users"></i> Select Firms</h2>
          <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3">
            {% for firm in firms %}
            <label for="firm-{{ firm.id }}"
                   class="flex items-center gap-2 border border-slate-200 rounded-lg p-3 text-sm text-slate-700 hover:bg-slate-50 cursor-pointer transition">
              <input type="checkbox" name="firms" value="{{ firm.id }}" class="form-check" id="firm-{{ firm.id }}">
              {{ firm.firm_name }}
            </label>
            {% endfor %}
          </div>
        </div>

      </div>
      <div class="px-6 py-4 bg-slate-50 border-t border-slate-100 rounded-b-2xl flex justify-end">
        <button type="submit" onclick="validateForm()" class="btn-success">
          <i class="fas fa-floppy-disk"></i> Save
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% block script %}
<script>
  function updateBudget(selectElement) {
    var selectedOption = selectElement.options[selectElement.selectedIndex];
    var budgetInput = document.getElementById("budget");
    budgetInput.value = selectedOption.getAttribute("data-budget");
    updateTotalCost();
  }

  function updateTotalCost() {
    var budget = parseFloat(document.getElementById("budget").value);
    var contingencyRate = 3;
    var contingency = budget * (contingencyRate / 100);

    var contingencyInput = document.getElementById("contingency");
    var totalCostInput = document.getElementById("cost_estimate");
    var cost_estimate = budget - contingency;
    totalCostInput.value = cost_estimate.toFixed(2);
    contingencyInput.value = contingency.toFixed(2);
  }

  $(document).on("change", "#budget, #contingency, #usercontribution", function () {
    updateTotalCost();
  });

  function validateForm() {
    var form = document.getElementById("add_project_form");
    if (!form.checkValidity()) {
      event.preventDefault();
      event.stopPropagation();
      form.classList.add("was-validated");
    }
    form.classList.add("was-validated");
  }
</script>
{% endblock %}
