{# HTMX partial: upload a सिफारिस the ward sent on paper #}
<form class="mt-3 rounded-lg border border-brand-200 bg-brand-50/50 p-3 space-y-2"
      hx-post="{% url 'uc_sifaris_upload' project.id kind %}" hx-encoding="multipart/form-data"
      hx-target="this" hx-swap="outerHTML">
  {% csrf_token %}
  <p class="text-xs font-semibold text-slate-700">{{ title }} — स्क्यान अपलोड</p>
  {% for e in errors %}<p class="text-xs text-rose-600"><i class="fas fa-circle-exclamation"></i> {{ e }}</p>{% endfor %}
  <label class="sif-drop relative flex items-center gap-3 rounded-lg border-2 border-dashed border-brand-300 bg-white px-3 py-3 cursor-pointer transition hover:border-brand-500 hover:bg-brand-50">
    <span class="sif-icon flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-brand-100 text-brand-700">
      <i class="fas fa-cloud-arrow-up text-lg"></i>
    </span>
    <span class="min-w-0 flex-1">
      <span class="sif-title block text-sm font-semibold text-brand-800 truncate">सिफारिस पत्र छान्नुहोस्</span>
      <span class="sif-sub block text-[11px] leading-snug text-slate-500">यहाँ थिच्नुहोस् वा फाइल तानेर छोड्नुहोस् · PDF, JPG, PNG</span>
    </span>
    <input type="file" name="document" accept=".pdf,.jpg,.jpeg,.png" required
           class="absolute inset-0 h-full w-full cursor-pointer opacity-0"
           onchange="(function(i){var l=i.closest('.sif-drop'),f=i.files&&i.files[0];if(!f)return;var kb=f.size/1024,sz=kb>1024?(kb/1024).toFixed(1)+' MB':Math.max(1,Math.round(kb))+' KB';l.querySelector('.sif-title').textContent=f.name;l.querySelector('.sif-sub').textContent=sz+' · अर्को छान्न फेरि थिच्नुहोस्';l.classList.remove('border-brand-300','border-dashed');l.classList.add('border-emerald-400','bg-emerald-50');var ic=l.querySelector('.sif-icon');ic.classList.remove('bg-brand-100','text-brand-700');ic.classList.add('bg-emerald-100','text-emerald-700');ic.innerHTML='<i class=&quot;fas '+(/\.pdf$/i.test(f.name)?'fa-file-pdf':'fa-file-image')+' text-lg&quot;></i>';})(this)">
  </label>
  <div class="grid grid-cols-2 gap-2">
    <input name="chalani_number" value="{{ post.chalani_number|default:'' }}" class="form-input !text-xs !py-1.5" placeholder="चलानी नं.">
    <div class="relative">
      <i class="fas fa-calendar-days pointer-events-none absolute left-2.5 top-1/2 -translate-y-1/2 text-xs text-brand-500"></i>
      <input name="recommendation_date" value="{{ post.recommendation_date|default:'' }}" class="form-input nepali-date !text-xs !py-1.5 !pl-7 cursor-pointer" placeholder="मिति छान्नुहोस्" autocomplete="off">
    </div>
  </div>
  <input name="letter_number" value="{{ post.letter_number|default:'' }}" class="form-input !text-xs !py-1.5" placeholder="पत्र संख्या (ऐच्छिक)">
  <div class="flex justify-end gap-1.5">
    <button type="button" class="btn-chip-slate" onclick="this.closest('[id^=wf-form-]').innerHTML=''">रद्द</button>
    <button type="submit" class="btn-chip-brand"><i class="fas fa-upload"></i> अपलोड गर्नुहोस्</button>
  </div>
</form>
