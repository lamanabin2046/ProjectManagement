{# HTMX partial: upload a सिफारिस the ward sent on paper #}
<form class="mt-3 rounded-lg border border-brand-200 bg-brand-50/50 p-3 space-y-2"
      hx-post="{% url 'uc_sifaris_upload' project.id kind %}" hx-encoding="multipart/form-data"
      hx-target="this" hx-swap="outerHTML">
  {% csrf_token %}
  <p class="text-xs font-semibold text-slate-700">{{ title }} — स्क्यान अपलोड</p>
  {% for e in errors %}<p class="text-xs text-rose-600"><i class="fas fa-circle-exclamation"></i> {{ e }}</p>{% endfor %}
  <input type="file" name="document" accept=".pdf,.jpg,.jpeg,.png" class="block w-full text-xs file:mr-2 file:rounded file:border-0 file:bg-white file:px-2 file:py-1">
  <div class="grid grid-cols-2 gap-2">
    <input name="chalani_number" value="{{ post.chalani_number|default:'' }}" class="form-input !text-xs !py-1.5" placeholder="चलानी नं.">
    <input name="recommendation_date" value="{{ post.recommendation_date|default:'' }}" class="form-input !text-xs !py-1.5" placeholder="मिति (२०८३-०७-१०)">
  </div>
  <input name="letter_number" value="{{ post.letter_number|default:'' }}" class="form-input !text-xs !py-1.5" placeholder="पत्र संख्या (ऐच्छिक)">
  <div class="flex justify-end gap-1.5">
    <button type="button" class="btn-chip-slate" onclick="this.closest('[id^=wf-form-]').innerHTML=''">रद्द</button>
    <button type="submit" class="btn-chip-brand"><i class="fas fa-upload"></i> अपलोड गर्नुहोस्</button>
  </div>
</form>
