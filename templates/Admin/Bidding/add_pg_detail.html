{% extends 'base.html' %}
{% load static %}
{% block title %}PG माग फाराम{% endblock %}
{% block content %}
<div class="max-w-5xl mx-auto space-y-4">

  <div>
    <h1 class="text-lg md:text-xl font-bold text-slate-800">ठेक्काको सम्झौताका लागी PG माग फाराम</h1>
    <p class="text-sm text-slate-500 mt-0.5">कार्यसम्पादन जमानत माग विवरण भर्नुहोस्</p>
  </div>

  <div class="card">
    <form action="{% url 'add_pg_requirement' bidding_id %}" method="post" id="add_project_form">
      {% csrf_token %}
      <div class="p-6 space-y-6">

        <div>
          <h2 class="section-title"><i class="fas fa-building"></i> योजना</h2>
          <input type="hidden" name="bidding_id" value="{{ bidding_id }}">
          <div>
            <label class="form-label">योजनाको नामः</label>
            <input type="text" class="form-input" name="project" value="{{ project_name }}" required>
          </div>
        </div>

        <div>
          <h2 class="section-title"><i class="fas fa-file-contract"></i> ठेक्का विवरण</h2>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="form-label">ठेक्का नम्बर</label>
              <input type="text" class="form-input" name="bidding_number" value="{{ bidding_number }}" required>
            </div>
            <div>
              <label class="form-label">फर्मको नाम नेपालीमा</label>
              <input type="text" class="form-input" name="bidder_name_nepali" value="{{ bidding.bidder_name_nepali }}" required>
            </div>
            <div>
              <label class="form-label">ठेक्का स्वीकृत मिति</label>
              <input type="text" class="form-input nepali-date date-required-check" name="bid_approved_date" placeholder="ठेक्का स्वीकृत मिति" required>
            </div>
          </div>
        </div>

        <div>
          <h2 class="section-title"><i class="fas fa-university"></i> PG माग विवरण</h2>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="form-label">कार्यसम्पादन जमानत रकम</label>
              <input type="text" class="form-input" name="performance_bond_amount_required" placeholder="कार्यसम्पादन जमानत रकम">
            </div>
            <div>
              <label class="form-label">PG को अन्तिम मिति</label>
              <input type="text" class="form-input nepali-date date-required-check" name="performance_bond_expiring_date_required" placeholder="PG अन्तिम मिति" required>
            </div>
          </div>
        </div>

      </div>
      <div class="px-6 py-4 bg-slate-50 border-t border-slate-100 rounded-b-2xl flex justify-end">
        <button type="submit" onclick="validateForm()" class="btn-success">
          <i class="fas fa-print"></i> Save &amp; Print
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% block script %}
<script>
  function validateForm() {
    var form = document.getElementById("add_project_form");
    if (!form.checkValidity()) {
      event.preventDefault();
      event.stopPropagation();
      form.classList.add("was-validated");
    }
    form.classList.add("was-validated");
  }
</script>
{% endblock %}
