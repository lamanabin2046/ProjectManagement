{% if messages %}
<div class="space-y-2 mb-4">
  {% for message in messages %}
  <div class="flex items-start gap-3 rounded-xl border px-4 py-3 text-sm shadow-card
              {% if message.tags == 'success' %} bg-emerald-50 border-emerald-200 text-emerald-800
              {% elif message.tags == 'error' or message.tags == 'danger' %} bg-rose-50 border-rose-200 text-rose-800
              {% elif message.tags == 'warning' %} bg-amber-50 border-amber-200 text-amber-800
              {% else %} bg-brand-50 border-brand-200 text-brand-800 {% endif %}"
       role="alert" data-auto-dismiss>
    <i class="fas
              {% if message.tags == 'success' %} fa-circle-check
              {% elif message.tags == 'error' or message.tags == 'danger' %} fa-circle-exclamation
              {% elif message.tags == 'warning' %} fa-triangle-exclamation
              {% else %} fa-circle-info {% endif %} mt-0.5"></i>
    <span class="flex-1">{{ message }}</span>
    <button type="button" onclick="this.closest('[role=alert]').remove()" class="text-current/60 hover:text-current">
      <i class="fas fa-xmark"></i>
    </button>
  </div>
  {% endfor %}
</div>
<script>
  setTimeout(function () {
    document.querySelectorAll('[data-auto-dismiss]').forEach(function (el) {
      el.style.transition = 'opacity .4s ease';
      el.style.opacity = '0';
      setTimeout(function () { el.remove(); }, 400);
    });
  }, 4000);
</script>
{% endif %}
